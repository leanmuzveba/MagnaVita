<!-- Supabase → Authentication → Emails → Templates → "Reset password".
     Subject: Your MagnaVita password code: {{ .Token }} -->
<div style="font-family: Arial, sans-serif; max-width: 480px; margin: 0 auto; color: #1A2A20;">
  <h2 style="color: #135D44;">Reset your MagnaVita password</h2>
  <p>Enter this code in the app, then choose a new password:</p>
  <p style="font-size: 32px; font-weight: bold; letter-spacing: 8px; color: #135D44; background: #F6FCEF; padding: 16px; text-align: center; border-radius: 12px;">
    {{ .Token }}
  </p>
  <p>The code expires in an hour. If you didn’t ask to reset your password, you can ignore this email; your password stays the same.</p>
</div>
